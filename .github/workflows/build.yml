# Builds Vault (APK) and, when asked, publishes it as a GitHub release.
#
# Secrets (Settings -> Secrets and variables -> Actions), the same key as the other apps:
#   KEYSTORE_BASE64  the signing keystore, base64-encoded
#   KEYSTORE_PASS    its password
#   KEY_ALIAS        optional: the key's alias (the keystore's first key otherwise)
# Without them the APK is signed with a throwaway key (fine for a test install).

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Your own icon (icon.png at the top of the repo, if there is one)
        if: hashFiles('icon.png') != ''
        run: |
          pip install --quiet pillow
          python3 .github/custom_icon.py icon.png

      - name: The page the app opens (web/app.html, from web/index.html)
        run: python3 tools/app_html.py

      - name: Build the APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
          ls -l app/build/outputs/apk/release/

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          apksigner="$(ls -t "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          unsigned="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p dist
          out="dist/Vault-1.${{ github.run_number }}.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ]; then
            # forgive a stray space or line break picked up when the secrets were pasted
            KEYSTORE_PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')"; export KEYSTORE_PASS
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            alias="$KEY_ALIAS"
            [ -z "$alias" ] && alias="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" | sed -n 's/^Alias name: //p' | head -1)"
            "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$alias" \
              --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out "$out" "$unsigned"
            rm -f "$RUNNER_TEMP/release.keystore"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: signing with a throwaway key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -alias test -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass testtest -keypass testtest -dname "CN=Test" > /dev/null
            "$apksigner" sign --ks "$RUNNER_TEMP/test.keystore" --ks-key-alias test --ks-pass pass:testtest --out "$out" "$unsigned"
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi
          "$apksigner" verify "$out"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vault-apk
          path: dist/
          retention-days: 14

      - name: Publish the release
        if: ${{ inputs.release && env.SIGNED == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.${{ github.run_number }}"
          gh release create "$tag" dist/*.apk --title "Vault $tag" --notes "Vault $tag"
