<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <!-- back arm: deep indigo into violet -->
    <linearGradient id="back" x1="28" y1="28" x2="58" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/><stop offset=".5" stop-color="#3d4fe6"/><stop offset="1" stop-color="#3a22b8"/>
    </linearGradient>
    <!-- front arm: sky into periwinkle into violet -->
    <linearGradient id="front" x1="80" y1="26" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fe1ff"/><stop offset=".38" stop-color="#4fa6ff"/><stop offset=".72" stop-color="#6f6cff"/><stop offset="1" stop-color="#9257f5"/>
    </linearGradient>
    <linearGradient id="lift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx=".85" cy=".9" r=".5">
      <stop offset="0" stop-color="#ff7ac8" stop-opacity=".45"/><stop offset="1" stop-color="#ff7ac8" stop-opacity="0"/>
    </radialGradient>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="-2" dy="2.5" stdDeviation="2.6" flood-color="#1d0f7a" flood-opacity=".5"/></filter>
    <filter id="ground" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#14205e" flood-opacity=".22"/></filter>
  </defs>
  <g filter="url(#ground)">
    <!-- left arm, behind -->
    <path d="M27.5 36.5 C26 31 30 27.5 35 27.5 H40 C43.5 27.5 46.2 29.6 47.3 33 L58.5 70 L52 81.5 C49 81.5 47 80 46 77.5 Z" fill="url(#back)"/>
    <path d="M27.5 36.5 C26 31 30 27.5 35 27.5 H40 C43.5 27.5 46.2 29.6 47.3 33 L58.5 70 L52 81.5 C49 81.5 47 80 46 77.5 Z" fill="url(#lift)"/>
    <!-- right arm, in front, folding over at the bottom -->
    <g filter="url(#cast)">
      <path d="M80.5 36.5 C82 31 78 27.5 73 27.5 H68 C64.5 27.5 61.8 29.6 60.7 33 L46.2 76 C45 79.8 47.6 82.5 51.2 82.5 H55 C58.2 82.5 60.7 80.6 61.7 77.6 Z" fill="url(#front)"/>
      <path d="M80.5 36.5 C82 31 78 27.5 73 27.5 H68 C64.5 27.5 61.8 29.6 60.7 33 L46.2 76 C45 79.8 47.6 82.5 51.2 82.5 H55 C58.2 82.5 60.7 80.6 61.7 77.6 Z" fill="url(#warm)"/>
      <path d="M80.5 36.5 C82 31 78 27.5 73 27.5 H68 C64.5 27.5 61.8 29.6 60.7 33 L46.2 76 C45 79.8 47.6 82.5 51.2 82.5 H55 C58.2 82.5 60.7 80.6 61.7 77.6 Z" fill="url(#lift)"/>
    </g>
  </g>
</svg>
